# Netlify config for this fork. Removed from upstream: the author's site ID,
# next.busrouter.sg redirect, and proxies to the author's Mapbox style and ads.txt.

[context.production]
  publish = "dist/"
  command = "npm run build"

[[plugins]]
package = "netlify-plugin-ttl-cache"
  [plugins.inputs]
  path = "dist"
